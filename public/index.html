<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>队友食录</title>
  <meta name="description" content="团队餐厅记录 & 决策工具">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="队友食录">
  <!-- 前端库直接打包在项目里，不走外部 CDN —— 国内访问 unpkg/jsdelivr 时好时坏，
       部分"CDN 加速"类浏览器插件还会把脚本改成异步加载，打乱执行顺序导致页面白屏 -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/lucide.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: #FBF6EE;
      color: #26201C;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // lucide (vanilla, non-React CDN build) exports each icon as raw SVG node
    // data — [[tag, attrs], ...] — not a React component. Wrap each one into
    // a real component so the rest of the app can use JSX like <Star .../>.
    function makeIconComponent(iconData) {
      return function LucideIcon({ size = 18, color = "currentColor", strokeWidth = 2, fill = "none", className = "", style, ...rest }) {
        return React.createElement(
          "svg",
          {
            width: size,
            height: size,
            viewBox: "0 0 24 24",
            fill,
            stroke: color,
            strokeWidth,
            strokeLinecap: "round",
            strokeLinejoin: "round",
            className: ("lucide-icon " + className).trim(),
            style,
            ...rest,
          },
          (iconData || []).map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))
        );
      };
    }
    const ICON_NAMES = ["Plus", "Star", "Dice5", "Camera", "Search", "X", "Trash2", "MapPin", "Pencil", "SlidersHorizontal", "ThumbsUp", "ThumbsDown", "Minus", "Utensils", "Link2", "Check"];
    const Icons = {};
    ICON_NAMES.forEach((n) => { Icons[n] = makeIconComponent(lucide[n]); });
    const { Plus, Star, Dice5, Camera, Search, X, Trash2, MapPin, Pencil, SlidersHorizontal, ThumbsUp, ThumbsDown, Minus, Utensils, Link2, Check } = Icons;

    const API = typeof window !== 'undefined' ? window.location.origin : '';

    const CUISINES = ["火锅", "中餐", "日料", "韩餐", "西餐", "烧烤", "快餐", "咖啡甜品", "东南亚", "其他"];
    const CUR = { "¥": "¥", "$": "$" };

    function compressImage(file, maxDim = 1200, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
            else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const searchLinks = (name) => {
      const q = encodeURIComponent(name);
      return [
        { label: "点评", url: `https://www.baidu.com/s?wd=${q}%20大众点评` },
        { label: "小红书", url: `https://www.xiaohongshu.com/search_result?keyword=${q}` },
        { label: "地图", url: `https://uri.amap.com/search?keyword=${q}` },
      ];
    };

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    function App() {
      const [ready, setReady] = useState(false);
      const [me, setMe] = useState("");
      const [needName, setNeedName] = useState(false);
      const [title, setTitle] = useState("队友食录");
      const [list, setList] = useState([]);
      const [q, setQ] = useState("");
      const [sort, setSort] = useState("new");
      const [filterCuisine, setFilterCuisine] = useState("");
      const [editing, setEditing] = useState(null);
      const [deciding, setDeciding] = useState(false);
      const [toast, setToast] = useState("");

      useEffect(() => {
        (async () => {
          try {
            const resTitle = await fetch(`${API}/api/meta/title`).then(r => r.json());
            if (resTitle.value) setTitle(resTitle.value);
            const resResto = await fetch(`${API}/api/restaurants`).then(r => r.json());
            setList(resResto || []);
          } catch (e) {
            console.error('Load error:', e);
            flash('数据加载失败');
          }
          setReady(true);
        })();
        const nm = localStorage.getItem('me:name');
        if (nm) setMe(nm);
        else setNeedName(true);
      }, []);

      const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 2200); };

      const saveResto = useCallback(async (r) => {
        try {
          await fetch(`${API}/api/restaurants`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(r),
          });
          setList((prev) => {
            const i = prev.findIndex((x) => x.id === r.id);
            if (i === -1) return [...prev, r];
            const cp = [...prev]; cp[i] = r; return cp;
          });
          return true;
        } catch (e) {
          console.error('Save error:', e);
          flash("保存失败");
          return false;
        }
      }, []);

      const removeResto = useCallback(async (id) => {
        try {
          await fetch(`${API}/api/restaurants/${id}`, { method: 'DELETE' });
          setList((prev) => prev.filter((x) => x.id !== id));
        } catch (e) {
          console.error('Delete error:', e);
          flash("删除失败");
        }
      }, []);

      const saveTitle = async (t) => {
        setTitle(t);
        await fetch(`${API}/api/meta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'title', value: t }),
        });
      };

      const saveMe = (nm) => {
        setMe(nm);
        setNeedName(false);
        localStorage.setItem('me:name', nm);
      };

      let shown = list.filter((r) => {
        if (filterCuisine && !(r.cuisine || []).includes(filterCuisine)) return false;
        if (q) {
          const hay = (r.name + " " + (r.dishes || []).map((d) => d.name).join(" ") + " " + (r.address || "")).toLowerCase();
          if (!hay.includes(q.toLowerCase())) return false;
        }
        return true;
      });
      shown = [...shown].sort((a, b) => {
        if (sort === "new") return (b.createdAt || 0) - (a.createdAt || 0);
        if (sort === "rating") return (b.rating || 0) - (a.rating || 0);
        if (sort === "cheap") return (a.price || 1e9) - (b.price || 1e9);
        if (sort === "pricey") return (b.price || -1) - (a.price || -1);
        return 0;
      });

      return (
        <div className="app">
          <style>{CSS}</style>
          <header className="hd">
            <div className="hd-l">
              <span className="logo"><Utensils size={18} strokeWidth={2.4} /></span>
              <EditableTitle value={title} onSave={saveTitle} />
            </div>
            <button className="who" onClick={() => setNeedName(true)} title="切换名字">
              {me ? me : "设置名字"}
            </button>
          </header>

          <div className="bar">
            <div className="searchbox">
              <Search size={16} />
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="搜餐厅、菜名、地址…" />
              {q && <button className="clr" onClick={() => setQ("")}><X size={14} /></button>}
            </div>
            <button className="decide" onClick={() => setDeciding(true)}>
              <Dice5 size={18} strokeWidth={2.3} /> 今天吃啥
            </button>
          </div>

          <div className="filters">
            <div className="chips">
              <button className={"chip" + (filterCuisine === "" ? " on" : "")} onClick={() => setFilterCuisine("")}>全部</button>
              {CUISINES.map((c) => (
                <button key={c} className={"chip" + (filterCuisine === c ? " on" : "")} onClick={() => setFilterCuisine(filterCuisine === c ? "" : c)}>{c}</button>
              ))}
            </div>
            <div className="sortrow">
              <SlidersHorizontal size={14} />
              <select value={sort} onChange={(e) => setSort(e.target.value)}>
                <option value="new">最新添加</option>
                <option value="rating">评分最高</option>
                <option value="cheap">人均最低</option>
                <option value="pricey">人均最高</option>
              </select>
              <span className="count">{shown.length} 家</span>
            </div>
          </div>

          <main className="grid">
            {!ready && <div className="empty">加载中…</div>}
            {ready && shown.length === 0 && (
              <div className="empty">
                <p className="e-big">还没有餐厅</p>
                <p className="e-sub">{list.length === 0 ? "加上你们吃过的第一家，全队都能看到。" : "换个筛选条件试试。"}</p>
                {list.length === 0 && <button className="e-btn" onClick={() => setEditing({})}><Plus size={16} /> 加第一家</button>}
              </div>
            )}
            {ready && shown.map((r) => (
              <Card key={r.id} r={r} onEdit={() => setEditing(r)} onDelete={() => removeResto(r.id)} />
            ))}
          </main>

          <button className="fab" onClick={() => setEditing({})} title="加餐厅"><Plus size={24} strokeWidth={2.6} /></button>

          {editing && (
            <Editor
              initial={editing}
              me={me}
              onClose={() => setEditing(null)}
              onSave={async (r) => { const ok = await saveResto(r); if (ok) { setEditing(null); flash("已保存"); } }}
            />
          )}

          {deciding && <Decider list={list} onClose={() => setDeciding(false)} onOpen={(r) => { setDeciding(false); setEditing(r); }} />}

          {needName && <NamePrompt current={me} onSave={saveMe} onClose={() => me && setNeedName(false)} />}

          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    function EditableTitle({ value, onSave }) {
      const [ed, setEd] = useState(false);
      const [v, setV] = useState(value);
      useEffect(() => setV(value), [value]);
      if (ed) return (
        <input className="title-input" autoFocus value={v}
          onChange={(e) => setV(e.target.value)}
          onBlur={() => { setEd(false); if (v.trim()) onSave(v.trim()); }}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }} />
      );
      return <button className="title" onClick={() => setEd(true)}>{value}<Pencil size={12} /></button>;
    }

    function Stars({ value = 0, size = 16, onChange }) {
      const [hover, setHover] = useState(0);
      return (
        <span className="stars">
          {[1, 2, 3, 4, 5].map((n) => {
            const active = (hover || value) >= n;
            return (
              <button key={n} type="button" className="star" disabled={!onChange}
                onMouseEnter={() => onChange && setHover(n)} onMouseLeave={() => onChange && setHover(0)}
                onClick={() => onChange && onChange(n)}>
                <Star size={size} fill={active ? "#F2A93B" : "none"} color={active ? "#F2A93B" : "#DBCEBC"} strokeWidth={1.8} />
              </button>
            );
          })}
        </span>
      );
    }

    function Card({ r, onEdit, onDelete }) {
      const [confirm, setConfirm] = useState(false);
      const photo = (r.photos || [])[0];
      const goods = (r.dishes || []).filter((d) => d.verdict === "good");
      return (
        <article className="card">
          <div className="card-top" onClick={onEdit}>
            {photo
              ? <img src={photo} alt={r.name} className="thumb" />
              : <div className="thumb ph"><Utensils size={26} /></div>}
            {(r.photos || []).length > 1 && <span className="pcount"><Camera size={11} /> {r.photos.length}</span>}
          </div>
          <div className="card-body">
            <div className="card-head">
              <h3 onClick={onEdit}>{r.name}</h3>
              <div className="card-actions">
                <button onClick={onEdit}><Pencil size={14} /></button>
                <button onClick={() => setConfirm(true)}><Trash2 size={14} /></button>
              </div>
            </div>
            <div className="meta">
              <Stars value={r.rating} size={14} />
              {r.price ? <span className="price">{(r.currency || "¥")}{r.price}<i>/人</i></span> : null}
            </div>
            {(r.cuisine || []).length > 0 && (
              <div className="tags">{r.cuisine.map((c) => <span key={c} className="tag">{c}</span>)}</div>
            )}
            {goods.length > 0 && (
              <p className="dishes"><ThumbsUp size={12} /> {goods.map((d) => d.name).join("、")}</p>
            )}
            {r.address && (
              <a
                className="addr"
                href={`https://uri.amap.com/search?keyword=${encodeURIComponent(r.name + " " + r.address)}`}
                target="_blank"
                rel="noreferrer"
              >
                <MapPin size={12} /> {r.address}
              </a>
            )}

            <div className="links">
              {searchLinks(r.name).map((l) => (
                <a key={l.label} href={l.url} target="_blank" rel="noreferrer" className="qlink">{l.label}</a>
              ))}
              {(r.links || []).map((l, i) => (
                <a key={i} href={l.url} target="_blank" rel="noreferrer" className="qlink saved"><Link2 size={11} /> {l.label}</a>
              ))}
            </div>
            {r.addedBy && <p className="by">by {r.addedBy}</p>}
          </div>

          {confirm && (
            <div className="confirm">
              <span>删掉「{r.name}」？</span>
              <div>
                <button className="c-no" onClick={() => setConfirm(false)}>取消</button>
                <button className="c-yes" onClick={onDelete}>删除</button>
              </div>
            </div>
          )}
        </article>
      );
    }

    function Editor({ initial, me, onClose, onSave }) {
      const isNew = !initial.id;
      const [name, setName] = useState(initial.name || "");
      const [rating, setRating] = useState(initial.rating || 0);
      const [currency, setCurrency] = useState(initial.currency || "¥");
      const [price, setPrice] = useState(initial.price || "");
      const [cuisine, setCuisine] = useState(initial.cuisine || []);
      const [address, setAddress] = useState(initial.address || "");
      const [notes, setNotes] = useState(initial.notes || "");
      const [photos, setPhotos] = useState(initial.photos || []);
      const [dishes, setDishes] = useState(initial.dishes || []);
      const [dishInput, setDishInput] = useState("");
      const [links, setLinks] = useState(initial.links || []);
      const [linkInput, setLinkInput] = useState("");
      const [busy, setBusy] = useState(false);
      const fileRef = useRef();

      const toggleCuisine = (c) => setCuisine((p) => p.includes(c) ? p.filter((x) => x !== c) : [...p, c]);

      const addPhotos = async (files) => {
        setBusy(true);
        const next = [...photos];
        for (const f of Array.from(files).slice(0, 6 - photos.length)) {
          try { next.push(await compressImage(f)); } catch {}
        }
        setPhotos(next.slice(0, 6));
        setBusy(false);
      };

      const addDish = () => {
        const n = dishInput.trim(); if (!n) return;
        setDishes((p) => [...p, { name: n, verdict: "good" }]); setDishInput("");
      };

      const cycleVerdict = (i) => setDishes((p) => p.map((d, j) => j === i
        ? { ...d, verdict: d.verdict === "good" ? "meh" : d.verdict === "meh" ? "bad" : "good" } : d));

      const addLink = () => {
        const u = linkInput.trim(); if (!u) return;
        let label = "链接";
        try { label = new URL(u.startsWith("http") ? u : "https://" + u).hostname.replace("www.", ""); } catch {}
        setLinks((p) => [...p, { label, url: u.startsWith("http") ? u : "https://" + u }]);
        setLinkInput("");
      };

      const submit = () => {
        if (!name.trim()) return;
        onSave({
          id: initial.id || uid(),
          name: name.trim(),
          rating, currency,
          price: price === "" ? null : Number(price),
          cuisine, address: address.trim(), notes: notes.trim(),
          photos, dishes, links,
          addedBy: initial.addedBy || me || "",
          createdAt: initial.createdAt || Date.now(),
        });
      };

      return (
        <div className="sheet-wrap" onClick={onClose}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-hd">
              <h2>{isNew ? "加餐厅" : "编辑"}</h2>
              <button onClick={onClose}><X size={20} /></button>
            </div>
            <div className="sheet-body">
              <label className="fl">餐厅名<span>*</span></label>
              <input className="in" value={name} onChange={(e) => setName(e.target.value)} placeholder="比如 海底捞（万象城店）" />

              <label className="fl">评分</label>
              <Stars value={rating} size={26} onChange={setRating} />

              <label className="fl">人均</label>
              <div className="price-row">
                <select value={currency} onChange={(e) => setCurrency(e.target.value)}>{Object.keys(CUR).map((c) => <option key={c}>{c}</option>)}</select>
                <input className="in" type="number" value={price} onChange={(e) => setPrice(e.target.value)} placeholder="120" />
              </div>

              <label className="fl">菜系</label>
              <div className="chips">
                {CUISINES.map((c) => (
                  <button key={c} type="button" className={"chip" + (cuisine.includes(c) ? " on" : "")} onClick={() => toggleCuisine(c)}>{c}</button>
                ))}
              </div>

              <label className="fl">菜品</label>
              <div className="dish-add">
                <input className="in" value={dishInput} onChange={(e) => setDishInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addDish()} placeholder="加个菜名回车" />
                <button type="button" className="mini" onClick={addDish}><Plus size={16} /></button>
              </div>
              <div className="dish-list">
                {dishes.map((d, i) => (
                  <span key={i} className={"dish v-" + d.verdict}>
                    <button type="button" onClick={() => cycleVerdict(i)} className="vbtn">
                      {d.verdict === "good" ? <ThumbsUp size={12} /> : d.verdict === "bad" ? <ThumbsDown size={12} /> : <Minus size={12} />}
                    </button>
                    {d.name}
                    <button type="button" className="dx" onClick={() => setDishes((p) => p.filter((_, j) => j !== i))}><X size={11} /></button>
                  </span>
                ))}
              </div>

              <label className="fl">照片</label>
              <div className="photos">
                {photos.map((p, i) => (
                  <div key={i} className="ph-item">
                    <img src={p} alt="" />
                    <button type="button" onClick={() => setPhotos((x) => x.filter((_, j) => j !== i))}><X size={12} /></button>
                  </div>
                ))}
                {photos.length < 6 && (
                  <button type="button" className="ph-add" onClick={() => fileRef.current.click()}>
                    {busy ? "…" : <Camera size={20} />}
                  </button>
                )}
                <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={(e) => addPhotos(e.target.files)} />
              </div>

              <label className="fl">地址</label>
              <input className="in" value={address} onChange={(e) => setAddress(e.target.value)} placeholder="选填" />

              <label className="fl">链接</label>
              <div className="dish-add">
                <input className="in" value={linkInput} onChange={(e) => setLinkInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addLink()} placeholder="粘贴链接回车" />
                <button type="button" className="mini" onClick={addLink}><Plus size={16} /></button>
              </div>
              <div className="dish-list">
                {links.map((l, i) => (
                  <span key={i} className="dish v-link"><Link2 size={12} /> {l.label}
                    <button type="button" className="dx" onClick={() => setLinks((p) => p.filter((_, j) => j !== i))}><X size={11} /></button>
                  </span>
                ))}
              </div>

              <label className="fl">备注</label>
              <textarea className="in ta" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="环境、排队、停车…选填" />
            </div>
            <div className="sheet-foot">
              <button className="btn ghost" onClick={onClose}>取消</button>
              <button className="btn solid" onClick={submit} disabled={!name.trim()}><Check size={16} /> 保存</button>
            </div>
          </div>
        </div>
      );
    }

    function Decider({ list, onClose, onOpen }) {
      const [cuisine, setCuisine] = useState("");
      const [maxPrice, setMaxPrice] = useState("");
      const [minRating, setMinRating] = useState(0);
      const [rolling, setRolling] = useState(false);
      const [flash, setFlash] = useState(null);
      const [picked, setPicked] = useState(null);
      const timer = useRef();

      const pool = list.filter((r) => {
        if (cuisine && !(r.cuisine || []).includes(cuisine)) return false;
        if (maxPrice && (r.price || 0) > Number(maxPrice)) return false;
        if (minRating && (r.rating || 0) < minRating) return false;
        return true;
      });

      const roll = () => {
        if (pool.length === 0) return;
        setPicked(null);
        const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || pool.length === 1) { setPicked(pool[Math.floor(Math.random() * pool.length)]); return; }
        setRolling(true);
        let t = 0; const total = 1500; let delay = 60;
        const step = () => {
          setFlash(pool[Math.floor(Math.random() * pool.length)]);
          t += delay; delay *= 1.12;
          if (t < total) timer.current = setTimeout(step, delay);
          else { setRolling(false); setFlash(null); setPicked(pool[Math.floor(Math.random() * pool.length)]); }
        };
        step();
      };

      useEffect(() => () => clearTimeout(timer.current), []);

      return (
        <div className="sheet-wrap" onClick={onClose}>
          <div className="decider" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-hd">
              <h2><Dice5 size={20} /> 今天吃啥</h2>
              <button onClick={onClose}><X size={20} /></button>
            </div>

            <div className="d-filters">
              <select value={cuisine} onChange={(e) => setCuisine(e.target.value)}>
                <option value="">不限菜系</option>
                {CUISINES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <input type="number" value={maxPrice} onChange={(e) => setMaxPrice(e.target.value)} placeholder="人均上限" />
              <select value={minRating} onChange={(e) => setMinRating(Number(e.target.value))}>
                <option value={0}>不限评分</option>
                <option value={3}>≥3星</option>
                <option value={4}>≥4星</option>
                <option value={5}>只要5星</option>
              </select>
            </div>

            <div className="d-stage">
              {rolling && <div className="rolling">{flash?.name || "…"}</div>}
              {!rolling && picked && (
                <div className="winner">
                  <div className="w-label">就它了！</div>
                  {(picked.photos || [])[0] && <img src={picked.photos[0]} alt="" />}
                  <div className="w-name">{picked.name}</div>
                  <div className="w-meta">
                    <Stars value={picked.rating} size={16} />
                    {picked.price ? <span className="price">{(picked.currency || "¥")}{picked.price}/人</span> : null}
                  </div>
                  {(picked.cuisine || []).length > 0 && <div className="tags center">{picked.cuisine.map((c) => <span key={c} className="tag">{c}</span>)}</div>}
                  <button className="w-open" onClick={() => onOpen(picked)}>看详情 / 编辑</button>
                </div>
              )}
              {!rolling && !picked && (
                <div className="d-hint">
                  {pool.length > 0 ? <>在 <b>{pool.length}</b> 家里帮你们抽一个</> : "没有符合条件的餐厅，放宽下条件"}
                </div>
              )}
            </div>

            <button className="d-roll" onClick={roll} disabled={pool.length === 0 || rolling}>
              <Dice5 size={20} strokeWidth={2.4} /> {picked ? "再抽一次" : "帮我们选"}
            </button>
          </div>
        </div>
      );
    }

    function NamePrompt({ current, onSave, onClose }) {
      const [v, setV] = useState(current || "");
      return (
        <div className="sheet-wrap" onClick={onClose}>
          <div className="namebox" onClick={(e) => e.stopPropagation()}>
            <h2>你是谁？</h2>
            <p>加餐厅时会标上你的名字，队友就知道是谁记的。</p>
            <input className="in" autoFocus value={v} onChange={(e) => setV(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && v.trim() && onSave(v.trim())} placeholder="你的名字" />
            <button className="btn solid" disabled={!v.trim()} onClick={() => v.trim() && onSave(v.trim())}>就叫这个</button>
          </div>
        </div>
      );
    }
